<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qorino — কোম্পানি বিশ্লেষণ</title>
<meta name="description" content="Qorino — ২০টি গবেষণা মাত্রায় কোম্পানির A–Z বিশ্লেষণ" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><text x='50' y='72' font-size='60' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>Q</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@600;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  :root{
    --bg:#f2f5fb; --card:#ffffff; --text:#0e1729; --muted:#64748b; --line:#e4e9f2;
    --accent:#6366f1; --accent2:#8b5cf6; --good:#10b981; --danger:#ef4444;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 30px -14px rgba(15,23,42,.25);
    --radius:16px;
  }
  [data-theme="dark"]{
    --bg:#070a12; --card:#101728; --text:#e8eefb; --muted:#8fa0bd; --line:#1d2739;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.85);
  }
  body{
    font-family:'Hind Siliguri',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    -webkit-font-smoothing:antialiased; padding-bottom:60px;
    background-image:
      radial-gradient(1000px 520px at 8% -12%, rgba(99,102,241,.14), transparent 60%),
      radial-gradient(820px 420px at 92% 0%, rgba(139,92,246,.12), transparent 55%);
    background-attachment:fixed;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-weight:800;font-size:20px;font-family:'Inter',sans-serif;
    box-shadow:0 6px 18px -6px rgba(99,102,241,.8);
  }
  .brand-text strong{display:block;font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.15}
  .brand-text span{display:block;font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{
    font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--card);color:var(--text);padding:8px 13px;border-radius:10px;
    display:inline-flex;align-items:center;gap:6px;transition:.18s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .btn.ghost{background:transparent}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--text);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.18s;
  }
  .icon-btn:hover{border-color:var(--accent);transform:rotate(-8deg)}

  /* ---------- HERO ---------- */
  .hero{
    margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);display:flex;gap:24px;align-items:center;flex-wrap:wrap;
  }
  .hero-info{flex:1;min-width:280px}
  .inputs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .inputs input{
    font-family:inherit;font-size:15px;padding:11px 14px;border-radius:11px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;transition:.18s;
  }
  .inputs input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.16)}
  #companyName{flex:1;min-width:200px;font-weight:600}
  #companySector{width:190px}
  .hero-info h2{font-size:22px;font-weight:700;letter-spacing:-.2px}
  .hero-info .muted{font-size:13.5px;color:var(--muted);margin-top:3px}
  .bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:16px}
  .bar span{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .hero-stats{margin-top:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .hero-stats b{color:var(--accent);font-size:15px}

  .ring-wrap{position:relative;width:132px;height:132px;flex-shrink:0;margin:0 auto}
  .ring{width:132px;height:132px;transform:rotate(-90deg)}
  .ring-fg{transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
  .ring-text{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring-text strong{display:block;font-size:23px;font-weight:800;font-family:'Inter',sans-serif;letter-spacing:-.5px}
  .ring-text small{font-size:11px;color:var(--muted)}

  /* ---------- SEARCH ---------- */
  .searchbar{
    margin-top:18px;display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:11px 15px;box-shadow:var(--shadow);
  }
  .searchbar input{
    flex:1;border:none;outline:none;background:transparent;color:var(--text);
    font-family:inherit;font-size:15px;
  }
  .searchbar .clear{border:none;background:var(--line);color:var(--muted);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1}
  .searchbar .clear:hover{background:var(--danger);color:#fff}

  /* ---------- GRID ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-top:20px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:17px;cursor:pointer;transition:.2s;box-shadow:var(--shadow);
    border-top:3px solid var(--c);position:relative;overflow:hidden;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 14px 34px -16px color-mix(in srgb,var(--c) 60%, transparent)}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .ico{font-size:22px;line-height:1}
  .ico.sm{font-size:15px}
  .card .num{font-family:'Inter',sans-serif;font-size:12px;font-weight:800;color:var(--c);opacity:.6;letter-spacing:.5px}
  .card h3{font-size:15.5px;font-weight:700;line-height:1.35}
  .card .en{font-size:11.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-top:1px}
  .card .desc{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5;min-height:34px}
  .mini-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
  .mini-bar span{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .5s}
  .card-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px;font-weight:600}

  /* ---------- DETAIL ---------- */
  .detail{margin-top:20px}
  .back{
    font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--card);color:var(--muted);padding:8px 14px;border-radius:10px;margin-bottom:16px;transition:.18s;
  }
  .back:hover{color:var(--accent);border-color:var(--accent)}
  .detail-head{
    display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--c);
  }
  .detail-head .ico{font-size:34px}
  .crumb{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--c);font-weight:700}
  .detail-head h2{font-size:22px;font-weight:700;margin-top:2px}
  .detail-head .muted{font-size:13px;color:var(--muted);margin-top:3px}
  .detail-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0 12px}
  .detail-tools .muted{font-size:13px;color:var(--muted);font-weight:600;margin-left:auto}

  .qlist{display:flex;flex-direction:column;gap:9px}
  .q{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;
    transition:.18s;display:grid;grid-template-columns:1fr auto;gap:8px 12px;
  }
  .q:hover{border-color:color-mix(in srgb,var(--accent) 45%, var(--line))}
  .q.done{opacity:.62;background:color-mix(in srgb,var(--good) 6%, var(--card))}
  .q.done .q-text{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--good)}
  .q-row{display:flex;gap:11px;align-items:flex-start;cursor:pointer;grid-column:1}
  .q-row input{
    appearance:none;-webkit-appearance:none;width:19px;height:19px;flex-shrink:0;margin-top:2px;
    border:2px solid var(--line);border-radius:6px;cursor:pointer;transition:.15s;position:relative;background:var(--bg);
  }
  .q-row input:checked{background:var(--good);border-color:var(--good)}
  .q-row input:checked::after{
    content:'';position:absolute;left:5px;top:1.5px;width:4.5px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .q-text{font-size:14.5px;line-height:1.55}
  .note-toggle{
    border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;
    width:32px;height:32px;border-radius:9px;font-size:14px;display:grid;place-items:center;transition:.18s;grid-column:2;
  }
  .note-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .q-note{
    display:none;grid-column:1/-1;width:100%;min-height:64px;resize:vertical;
    font-family:inherit;font-size:13.5px;line-height:1.6;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;transition:.18s;
  }
  .q-note:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.14)}
  .q-note.has{display:block}
  .q.open-note .q-note{display:block}
  .q.open-note .note-toggle{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%, transparent)}

  /* ---------- RESULTS ---------- */
  .results{margin-top:20px}
  .res-group{margin-bottom:18px}
  .res-group h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}

  /* ---------- FOOTER ---------- */
  footer{margin-top:46px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.9}
  footer .danger{color:var(--danger);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;font-size:12.5px}
  .hidden{display:none !important}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);z-index:200;
    background:var(--text);color:var(--bg);padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;
    box-shadow:0 14px 34px -12px rgba(0,0,0,.5);opacity:0;transition:.3s;pointer-events:none;
  }
  .toast.show{transform:translate(-50%,0);opacity:1}

  @media(max-width:640px){
    .hero{padding:18px;gap:16px}
    .ring-wrap{width:110px;height:110px}
    .ring{width:110px;height:110px}
    .hero-info h2{font-size:19px}
    .top-actions .btn span{display:none}
    .top-actions .btn{padding:8px 11px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .card{padding:13px}
    .card .desc{display:none}
    .card h3{font-size:13.5px}
  }
  @media(max-width:400px){ .grid{grid-template-columns:1fr} }

  @media print{
    .topbar,.searchbar,.back,.detail-tools,.note-toggle,.toast,.hero .inputs,footer{display:none !important}
    body{background:#fff;color:#000}
    .card,.q,.hero,.detail-head{box-shadow:none;border-color:#ccc}
  }
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">Q</div>
      <div class="brand-text">
        <strong>Qorino</strong>
        <span>Company Analysis</span>
      </div>
    </div>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" title="থিম পরিবর্তন">🌙</button>
      <button id="exportBtn" class="btn ghost" title="JSON ফাইল ডাউনলোড">⬇ <span>এক্সপোর্ট</span></button>
      <button id="printBtn" class="btn ghost" title="প্রিন্ট / PDF">🖨 <span>প্রিন্ট</span></button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero-info">
      <div class="inputs">
        <input id="companyName" placeholder="কোম্পানির নাম লিখুন..." autocomplete="off" />
        <input id="companySector" placeholder="সেক্টর / ইন্ডাস্ট্রি" autocomplete="off" />
      </div>
      <h2>কোম্পানি গবেষণা ড্যাশবোর্ড</h2>
      <p class="muted">২০টি গবেষণা মাত্রা • <span id="totalQ">০</span>টি প্রশ্ন • অগ্রগতি স্বয়ংক্রিয়ভাবে সেভ হয়</p>
      <div class="bar"><span id="heroBar"></span></div>
      <div class="hero-stats"><b id="heroDone">০</b> / <span id="heroTotal">০</span> সম্পন্ন</div>
    </div>
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120" class="ring">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#8b5cf6" />
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10" />
        <circle id="ringFg" cx="60" cy="60" r="52" fill="none" stroke="url(#grad)" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"
                style="transform-origin:60px 60px" class="ring-fg" />
      </svg>
      <div class="ring-text"><strong id="ringPct">০%</strong><small>সম্পন্ন</small></div>
    </div>
  </section>

  <!-- ============ SEARCH ============ -->
  <div class="searchbar" id="searchWrap">
    <span>🔍</span>
    <input id="search" placeholder="প্রশ্ন খুঁজুন... (যেমন: পেটেন্ট, সরবরাহকারী, CEO, পেটেন্ট)" autocomplete="off" />
    <button id="clearSearch" class="clear hidden" title="মুছুন">✕</button>
  </div>

  <!-- ============ CONTENT ============ -->
  <div id="grid" class="grid"></div>
  <div id="results" class="results hidden"></div>
  <section id="detail" class="detail hidden"></section>

  <footer>
    <div><strong>Qorino</strong> — কোম্পানি গবেষণা ও বিশ্লেষণ প্ল্যাটফর্ম</div>
    <div>সব তথ্য আপনার ব্রাউজারেই সংরক্ষিত থাকে (localStorage) — কোনো সার্ভারে যায় না।</div>
    <div style="margin-top:6px"><button class="danger" id="resetBtn">সব ডেটা রিসেট করুন</button></div>
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   QORINO — Company Analysis
   ২০টি Research Dimension • ২৫০+ প্রশ্ন
   ========================================================= */

/* ---------------- DATA ---------------- */
const DATA = [
  {
    id: 1, icon: '🏛️', color: '#6366f1',
    title: 'কোম্পানির পরিচিতি', en: 'Company Identity',
    desc: 'ইতিহাস, প্রতিষ্ঠাতা, দেশ, মূল প্রতিষ্ঠান',
    qs: [
      'কোম্পানির পূর্ণ আইনগত নাম ও ব্র্যান্ড নাম কী?',
      'কোম্পানিটি কবে প্রতিষ্ঠিত হয়?',
      'প্রতিষ্ঠাতা কে বা কারা? তাদের শিক্ষা ও পেশাগত পটভূমি কী?',
      'কোম্পানির মূল প্রতিষ্ঠান (Parent Company) কোনটি?',
      'সদর দপ্তর কোন দেশে ও কোন শহরে অবস্থিত?',
      'কোম্পানির আইনগত ধরন কী (PLC / Ltd / LLC / Inc)?',
      'কোম্পানির নিবন্ধন নম্বর, ট্রেড লাইসেন্স ও TIN কী?',
      'কোম্পানি স্টক এক্সচেঞ্জে তালিকাভুক্ত কি না? টিকার সিম্বল কী?',
      'মালিকানা কাঠামো (শেয়ারহোল্ডিং প্যাটার্ন) কেমন?',
      'কোম্পানির মিশন, ভিশন ও মূল মূল্যবোধ কী?',
      'লোগো, ট্যাগলাইন ও ব্র্যান্ড পজিশনিং কী?',
      'কোম্পানির ইতিহাসের উল্লেখযোগ্য মাইলফলক কী কী?',
      'নাম পরিবর্তন, মার্জার বা অধিগ্রহণের কোনো ইতিহাস আছে কি?'
    ]
  },
  {
    id: 2, icon: '🏭', color: '#0ea5e9',
    title: 'ইন্ডাস্ট্রি শ্রেণীবিভাগ', en: 'Industry Classification',
    desc: 'Sector, industry, subindustry, niche',
    qs: [
      'কোম্পানিটি কোন মূল সেক্টরে কাজ করে?',
      'নির্দিষ্ট ইন্ডাস্ট্রি ও সাব-ইন্ডাস্ট্রি কোনটি?',
      'GICS / SIC / NIC কোড অনুযায়ী শ্রেণীবিভাগ কী?',
      'কোম্পানি কোন নিশ (Niche) মার্কেটে কাজ করে?',
      'ইন্ডাস্ট্রির বর্তমান আকার ও বার্ষিক বৃদ্ধির হার কত?',
      'ইন্ডাস্ট্রির প্রধান প্রবণতা (Trend) কী কী?',
      'ইন্ডাস্ট্রি লাইফ সাইকেলের কোন ধাপে আছে (উত্থান/পরিপক্ব/ক্ষয়)?',

/* ---------------- HELPERS ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const BN = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
const bn = n => String(n).replace(/\d/g, d => BN[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOTAL = DATA.reduce((s, d) => s + d.qs.length, 0);

/* ---------------- STATE ---------------- */
const LS_KEY = 'qorino_v1';
let state = { company: { name: '', sector: '' }, checked: {}, notes: {}, theme: 'light' };

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state.company = p.company || state.company;
      state.checked = p.checked || {};
      state.notes   = p.notes   || {};
      state.theme   = p.theme   || 'light';
    }
  } catch (e) { console.warn('load failed', e); }
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch (e) { toast('সেভ করা যায়নি — স্টোরেজ পূর্ণ'); }
  }, 150);
}

/* ---------------- PROGRESS ---------------- */
function dimDone(d) {
  let n = 0;
  d.qs.forEach((_, i) => { if (state.checked[`d${d.id}q${i}`]) n++; });
  return n;
}
function countDone() {
  let n = 0;
  DATA.forEach(d => n += dimDone(d));
  return n;
}
function updateProgress() {
  const done = countDone();
  const pct = Math.round((done / TOTAL) * 100);

  $('#heroBar').style.width = pct + '%';
  $('#heroDone').textContent = bn(done);
  $('#heroTotal').textContent = bn(TOTAL);
  $('#totalQ').textContent = bn(TOTAL);
  $('#ringPct').textContent = bn(pct) + '%';

  const C = 2 * Math.PI * 52;
  $('#ringFg').style.strokeDashoffset = C - (C * pct / 100);

  const dp = $('#dimProg');
  if (dp && dp.dataset.dim) {
    const d = DATA.find(x => x.id === +dp.dataset.dim);
    if (d) dp.textContent = `${bn(dimDone(d))} / ${bn(d.qs.length)} সম্পন্ন`;
  }
}

/* ---------------- RENDER: GRID ---------------- */
function renderGrid() {
  const g = $('#grid');
  g.innerHTML = DATA.map(d => {
    const done = dimDone(d), tot = d.qs.length;
    const pct = Math.round((done / tot) * 100);
    return `<article class="card" data-dim="${d.id}" style="--c:${d.color}">
      <div class="card-top">
        <div class="ico">${d.icon}</div>
        <div class="num">${bn(d.id).padStart(2, '০')}</div>
      </div>
      <h3>${esc(d.title)}</h3>
      <p class="en">${esc(d.en)}</p>
      <p class="desc">${esc(d.desc)}</p>
      <div class="mini-bar"><span style="width:${pct}%"></span></div>
      <div class="card-foot"><span>${bn(done)}/${bn(tot)}</span><span>${bn(pct)}%</span></div>
    </article>`;
  }).join('');

  $$('.card', g).forEach(c => {
    c.addEventListener('click', () => openDim(+c.dataset.dim));
  });
}

/* ---------------- RENDER: QUESTION ITEM ---------------- */
function qItemHTML(d, i) {
  const qid = `d${d.id}q${i}`;
  const done = !!state.checked[qid];
  const note = state.notes[qid] || '';
  return `<div class="q ${done ? 'done' : ''}" data-qid="${qid}">
    <label class="q-row">
      <input type="checkbox" data-qid="${qid}" ${done ? 'checked' : ''}>
      <span class="q-text">${esc(d.qs[i])}</span>
    </label>
    <button class="note-toggle" data-qid="${qid}" title="নোট লিখুন">📝</button>
    <textarea class="q-note ${note.trim() ? 'has' : ''}" data-qid="${qid}"
      placeholder="এই প্রশ্নের উত্তর / নোট এখানে লিখুন...">${esc(note)}</textarea>
  </div>`;
}

/* ---------------- RENDER: DETAIL ---------------- */
function openDim(id) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;

  const el = $('#detail');
  el.innerHTML = `
    <button class="back" id="backBtn">← সব গবেষণা মাত্রায় ফিরে যান</button>

    <div class="detail-head" style="--c:${d.color}">
      <div class="ico">${d.icon}</div>
      <div>
        <div class="crumb">Research Dimension ${bn(d.id)} / ${bn(DATA.length)}</div>
        <h2>${esc(d.title)}</h2>
        <p class="muted">${esc(d.en)} — ${esc(d.desc)}</p>
      </div>
    </div>

    <div class="detail-tools">
      <button class="btn ghost" id="checkAll">✓ সব টিক দিন</button>
      <button class="btn ghost" id="uncheckAll">✕ সব আনটিক</button>
      <span class="muted" id="dimProg" data-dim="${d.id}"></span>
    </div>

    <div class="qlist">${d.qs.map((_, i) => qItemHTML(d, i)).join('')}</div>
  `;

  $('#grid').classList.add('hidden');
  $('#searchWrap').classList.add('hidden');
  $('#results').classList.add('hidden');
  el.classList.remove('hidden');
  $('#search').value = '';
  $('#clearSearch').classList.add('hidden');

  $('#backBtn').onclick = showHome;

  $('#checkAll').onclick = () => {
    d.qs.forEach((_, i) => state.checked[`d${d.id}q${i}`] = true);
    $$('.q', el).forEach(q => {
      q.classList.add('done');
      $('input', q).checked = true;
    });
    save(); updateProgress();
  };

  $('#uncheckAll').onclick = () => {
    d.qs.forEach((_, i) => delete state.checked[`d${d.id}q${i}`]);
    $$('.q', el).forEach(q => {
      q.classList.remove('done');
      $('input', q).checked = false;
    });
    save(); updateProgress();
  };

  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showHome() {
  $('#detail').classList.add('hidden');
  $('#grid').classList.remove('hidden');
  $('#searchWrap').classList.remove('hidden');
  renderGrid();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------------- SEARCH ---------------- */
function renderSearch(raw) {
  const q = raw.trim().toLowerCase();
  const res = $('#results');
  const grid = $('#grid');

  if (!q) {
    res.classList.add('hidden');
    grid.classList.remove('hidden');
    $('#clearSearch').classList.add('hidden');
    return;
  }
  $('#clearSearch').classList.remove('hidden');
  grid.classList.add('hidden');
  res.classList.remove('hidden');

  let html = '', count = 0;

  DATA.forEach(d => {
    const titleMatch = d.title.toLowerCase().includes(q) || d.en.toLowerCase().includes(q);
    const idx = [];
    d.qs.forEach((t, i) => {
      if (titleMatch || t.toLowerCase().includes(q)) idx.push(i);
    });
    if (idx.length) {
      count += idx.length;
      html += `<div class="res-group">
        <h3><span class="ico sm">${d.icon}</span> ${esc(d.title)} <span style="color:var(--muted);font-weight:500;font-size:12px">(${bn(idx.length)})</span></h3>
        <div class="qlist">${idx.map(i => qItemHTML(d, i)).join('')}</div>
      </div>`;
    }
  });

  res.innerHTML = count
    ? `<p class="muted" style="font-size:13px;margin-bottom:14px">${bn(count)}টি ফলাফল পাওয়া গেছে</p>${html}`
    : `<div class="empty">😕 "${esc(raw)}" এর জন্য কোনো ফলাফল পাওয়া যায়নি</div>`;
}

/* ---------------- GLOBAL EVENTS ---------------- */
// checkbox
document.addEventListener('change', e => {
  const cb = e.target;
  if (cb.matches('input[type="checkbox"][data-qid]')) {
    const qid = cb.dataset.qid;
    if (cb.checked) state.checked[qid] = true;
    else delete state.checked[qid];
    const box = cb.closest('.q');
    if (box) box.classList.toggle('done', cb.checked);
    save(); updateProgress();
  }
});

// notes
document.addEventListener('input', e => {
  const ta = e.target;
  if (ta.matches('textarea[data-qid]')) {
    const qid = ta.dataset.qid;
    state.notes[qid] = ta.value;
    ta.classList.toggle('has', ta.value.trim().length > 0);
    save();
  }
});

// note toggle
document.addEventListener('click', e => {
  const b = e.target.closest('.note-toggle');
  if (b) {
    const q = b.closest('.q');
    q.classList.toggle('open-note');
    if (q.classList.contains('open-note')) {
      const ta = $('.q-note', q);
      setTimeout(() => ta.focus(), 40);
    }
  }
});

/* ---------------- THEME ---------------- */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  $('#themeBtn').textContent = state.theme === 'dark' ? '☀️' : '🌙';
}
$('#themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); save();
});

/* ---------------- COMPANY INPUTS ---------------- */
const nameInput = $('#companyName');
const sectorInput = $('#companySector');

nameInput.addEventListener('input', () => {
  state.company.name = nameInput.value;
  document.title = (nameInput.value.trim() || 'Qorino') + ' — কোম্পানি বিশ্লেষণ';
  save();
});
sectorInput.addEventListener('input', () => {
  state.company.sector = sectorInput.value;
  save();
});

/* ---------------- SEARCH EVENTS ---------------- */
let searchTimer;
$('#search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => renderSearch(v), 160);
});
$('#clearSearch').addEventListener('click', () => {
  $('#search').value = '';
  renderSearch('');
  $('#search').focus();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' &&
      document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    $('#search').focus();
  }
  if (e.key === 'Escape') {
    if (!$('#detail').classList.contains('hidden')) showHome();
    else if ($('#search').value) { $('#search').value = ''; renderSearch(''); }
  }
});

/* ---------------- EXPORT / PRINT ---------------- */
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

$('#exportBtn').addEventListener('click', () => {
  const out = {
    platform: 'Qorino Company Analysis',
    generatedAt: new Date().toISOString(),
    company: state.company,
    summary: { total: TOTAL, completed: countDone(), percent: Math.round(countDone() / TOTAL * 100) },
    dimensions: DATA.map(d => ({
      id: d.id,
      title: d.title,
      en: d.en,
      description: d.desc,
      progress: `${dimDone(d)}/${d.qs.length}`,
      questions: d.qs.map((t, i) => {
        const qid = `d${d.id}q${i}`;
        return { question: t, done: !!state.checked[qid], note: state.notes[qid] || '' };
      })
    }))
  };
  const safe = (state.company.name || 'company').trim().replace(/[^\w\u0980-\u09FF]+/g, '-');
  download(`qorino-${safe}.json`, JSON.stringify(out, null, 2), 'application/json');
  toast('✅ রিপোর্ট ডাউনলোড হয়েছে');
});

$('#printBtn').addEventListener('click', () => window.print());

/* ---------------- RESET ---------------- */
$('#resetBtn').addEventListener('click', () => {
  if (confirm('আপনি কি নিশ্চিত? সব টিক, নোট ও কোম্পানির নাম মুছে যাবে।')) {
    localStorage.removeItem(LS_KEY);
    state = { company: { name: '', sector: '' }, checked: {}, notes: {}, theme: state.theme };
    nameInput.value = ''; sectorInput.value = '';
    document.title = 'Qorino — কোম্পানি বিশ্লেষণ';
    showHome();
    toast('🔄 সব ডেটা রিসেট হয়েছে');
  }
});

/* ---------------- TOAST ---------------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------------- INIT ---------------- */
(function init() {
  load();
  applyTheme();

  nameInput.value = state.company.name || '';
  sectorInput.value = state.company.sector || '';
  if (state.company.name) document.title = state.company.name + ' — কোম্পানি বিশ্লেষণ';

  $('#totalQ').textContent = bn(TOTAL);
  renderGrid();
  updateProgress();
})();
</script>
</body>
</html>
